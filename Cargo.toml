[package]
name = "soul-vault"
version = "0.1.0"
edition = "2021"
description = "Your AI memory, unified. Distills AI conversations into a structured local vault."
license = "MIT"
repository = "https://github.com/user/soul-vault"
keywords = ["ai", "memory", "cli", "vault"]
categories = ["command-line-utilities"]

[[bin]]
name = "soul"
path = "src/main.rs"

[dependencies]
# CLI framework
clap = { version = "4", features = ["derive"] }

# TUI / Interactive
ratatui = "0.29"
crossterm = "0.28"

# HTTP / API
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }

# JSON / Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Progress / Style
indicatif = "0.17"
colored = "2"

# Error handling
anyhow = "1"
thiserror = "2"

# Archive handling
zip = "2"

# Utilities
dirs = "5"
chrono = "0.4"
regex = "1"
sha2 = "0.10"
notify = "7"
notify-debouncer-mini = "0.5"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
wiremock = "0.6"
regex = "1"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
